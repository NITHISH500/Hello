<!DOCTYPE html>
<html>
<head>
    <title>Skating🛼</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            margin: auto;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 90%;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Add Skarting Match</h2>

    <input type="text" id="match" placeholder="Match Name">
    <input type="text" id="place" placeholder="Place">
    <input type="number" id="price" placeholder=" Price">
    <button onclick="addMatch()">Save</button>

    <h2>Search Match</h2>
    <input type="text" id="search" placeholder="Search match name..." onkeyup="searchMatch()">

    <table>
        <thead>
            <tr>
                <th>Match</th>
                <th>Place</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="tableData"></tbody>
    </table>

</div>

<script>

let matches = JSON.parse(localStorage.getItem("matches")) || [];

function addMatch() {
    let match = document.getElementById("match").value;
    let place = document.getElementById("place").value;
    let price = document.getElementById("price").value;

    if(match === "" || place === "" || price === "") {
        alert("Fill all fields");
        return;
    }

    matches.push({ match, place, price });
    localStorage.setItem("matches", JSON.stringify(matches));

    display(matches);

    document.getElementById("match").value = "";
    document.getElementById("place").value = "";
    document.getElementById("price").value = "";
}

function display(data) {
    let table = document.getElementById("tableData");
    table.innerHTML = "";

    data.forEach(item => {
        table.innerHTML += `
            <tr>
                <td>${item.match}</td>
                <td>${item.place}</td>
                <td>${item.price}</td>
            </tr>
        `;
    });
}

function searchMatch() {
    let keyword = document.getElementById("search").value.toLowerCase();

    let filtered = matches.filter(m =>
        m.match.toLowerCase().includes(keyword)
    );

    display(filtered);
}

display(matches);

</script>

</body>
</html>
